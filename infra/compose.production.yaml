# Pametna kupovina on one Linux server (Oracle Cloud Always Free ARM or any
# VPS): PostGIS, the backend with the daily price cycle, and Caddy for HTTPS.
# Step by step: infra/ORACLE.md. Settings: .env.production (not in Git).

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: ghcr.io/baosystems/postgis:16-3.5
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
    # Parallel queries share memory through /dev/shm; Docker's 64 MB is too little.
    shm_size: ${POSTGRES_SHM_SIZE:-1g}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pametna_kupovina_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    image: pametna-kupovina-backend:release
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Also set in application-production.properties; repeated here so a jar
      # built without that file still never opens the administrative endpoints.
      ADMIN_API_KEY_REQUIRED: "true"
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SHOPPING_MAX_PRICE_AGE_DAYS: ${SHOPPING_MAX_PRICE_AGE_DAYS:-30}
      PRICE_IMPORT_ARCHIVE_DIRECTORY: /data/import-archive
      HEALTH_SHOW_DETAILS: never
      TZ: Europe/Belgrade
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTIONS:--Xms3g -Xmx4g -XX:+AlwaysPreTouch}
    volumes:
      - price_import_archive:/data/import-archive
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  # One verified dump into ./backups; ops/backup.sh runs it daily.
  database-backup:
    image: postgres:16-alpine
    profiles:
      - operations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        umask 077
        backup_file="/backups/pametna-kupovina-$$(date -u +%Y%m%dT%H%M%SZ).dump"
        pg_dump --format=custom --compress=9 --file="$${backup_file}"
        pg_restore --list "$${backup_file}" >/dev/null
        echo "Backup verified: $${backup_file}"

volumes:
  pametna_kupovina_postgres_data:
  caddy_data:
  caddy_config:
  price_import_archive:
