# The hosted server (infra/compose.production.yaml) runs the same daily price
# cycle as the Mac's local-daily profile: every chain in one sequential cycle
# after 08:00, retried up to three times a day. It logs to the console for
# Docker, and the administrative endpoints always ask for the admin key.
price-refresh.daily.enabled=true
price-import.schedule.enabled=false
maxi.price-import.schedule.enabled=false
verified-location-import.schedule.enabled=false
data-quality.monitor.enabled=true
admin.api-key-required=true
