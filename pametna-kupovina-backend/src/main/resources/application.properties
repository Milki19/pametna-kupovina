spring.application.name=pametna-kupovina-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.default-schema=app
spring.flyway.schemas=app
spring.flyway.validate-migration-naming=true

spring.sql.init.mode=never

management.endpoint.health.show-details=always

# Precizna korisnička lokacija je request-only podatak. Access log je
# podrazumevano isključen; bezbedan obrazac ne sadrži query string ni IP adresu.
server.tomcat.accesslog.enabled=false
server.tomcat.accesslog.pattern=%t "%m %U %H" %s %b %D

# PK-052: sve pretpostavke ukupnog troška su konfigurabilne i vraćaju se
# klijentu u svakom recommendation odgovoru.
shopping.optimization.candidate-radius-meters=15000
shopping.optimization.max-candidate-stores=20
shopping.optimization.cost-per-km=20.00
shopping.optimization.value-per-hour=400.00
shopping.optimization.cost-per-stop=80.00
shopping.optimization.straight-line-average-speed-kmh=30.00

# Realni OSRM adapter je spreman, ali je lokalno isključen da razvoj i testovi
# rade bez API ključa, spoljnog poziva i troška. USER parovi se nikada ne keširaju.
routing.osrm.enabled=false
routing.osrm.base-url=https://router.project-osrm.org/table/v1
routing.osrm.profile=driving
routing.osrm.public-pair-cache-ttl-seconds=86400
