spring.application.name=pametna-kupovina-backend
spring.devtools.add-properties=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# PostGIS je instaliran u Flyway `app` šemi. Svaka runtime konekcija mora da
# vidi i aplikacionu i `public` šemu, uključujući sveže restore-ovanu bazu koja
# nema lokalno ALTER ROLE podešavanje.
spring.datasource.hikari.connection-init-sql=SET search_path TO app, public

spring.flyway.enabled=true
spring.flyway.default-schema=app
spring.flyway.schemas=app
spring.flyway.validate-migration-naming=true

spring.sql.init.mode=never

management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}
management.endpoints.web.exposure.include=health
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-stacktrace=never
server.error.include-message=never

# Precizna korisnička lokacija je request-only podatak. Access log je
# podrazumevano isključen; bezbedan obrazac ne sadrži query string ni IP adresu.
server.tomcat.accesslog.enabled=false
server.tomcat.accesslog.pattern=%t "%m %U %H" %s %b %D

# PK-052: sve pretpostavke ukupnog troška su konfigurabilne i vraćaju se
# klijentu u svakom recommendation odgovoru.
shopping.optimization.candidate-radius-meters=15000
shopping.optimization.max-candidate-stores=20
shopping.optimization.max-price-age-days=${SHOPPING_MAX_PRICE_AGE_DAYS:30}
shopping.optimization.cost-per-km=20.00
shopping.optimization.value-per-hour=400.00
shopping.optimization.cost-per-stop=80.00
shopping.optimization.straight-line-average-speed-kmh=30.00

# Realni OSRM adapter je spreman, ali je lokalno isključen da razvoj i testovi
# rade bez API ključa, spoljnog poziva i troška. USER parovi se nikada ne keširaju.
routing.osrm.enabled=false
routing.osrm.base-url=https://router.project-osrm.org/table/v1
routing.osrm.profile=driving
routing.osrm.public-pair-cache-ttl-seconds=86400

# Cenovnici mogu biti veoma veliki. Importer ih snima u privremeni fajl,
# zatim ih obrađuje u dva prolaza bez držanja kompletnog preseka u memoriji.
price-import.http.connect-timeout-seconds=20
price-import.http.request-timeout-seconds=900
price-import.discovery-timeout-seconds=60
price-import.max-download-bytes=1500000000
price-import.archive.directory=${PRICE_IMPORT_ARCHIVE_DIRECTORY:}
price-import.http-endpoints.enabled=${PRICE_IMPORT_HTTP_ENDPOINTS_ENABLED:true}
price-import.worker.enabled=${PRICE_IMPORT_WORKER_ENABLED:false}
price-import.worker.instance-id=${PRICE_IMPORT_WORKER_INSTANCE_ID:local-worker}
price-import.worker.heartbeat-interval-ms=30000

# API kataloga samo otkriva i registruje potencijalne cenovnike. Novi skup
# ostaje u statusu DISCOVERED dok ga ne pregledamo i eksplicitno odobrimo.
price-import.catalog.api-url=${PRICE_IMPORT_CATALOG_API_URL:https://data.gov.rs/api/1/datasets/?q=cenovnici&page_size=100}
price-import.catalog.maximum-pages=${PRICE_IMPORT_CATALOG_MAXIMUM_PAGES:10}
price-import.catalog.additional-api-urls=${PRICE_IMPORT_CATALOG_ADDITIONAL_API_URLS:https://data.gov.rs/api/1/datasets/?q=cenovnik&page_size=100,https://data.gov.rs/api/1/datasets/?q=%D1%86%D0%B5%D0%BD%D0%BE%D0%B2%D0%BD%D0%B8%D1%86%D0%B8&page_size=100,https://data.gov.rs/api/1/datasets/?q=%D1%86%D0%B5%D0%BD%D0%BE%D0%B2%D0%BD%D0%B8%D0%BA&page_size=100}

# U razvoju je raspored isključen. Na hostovanom backendu se uključuje preko
# PRICE_IMPORT_SCHEDULE_ENABLED=true i liste kodova odvojene zarezima.
price-import.schedule.enabled=${PRICE_IMPORT_SCHEDULE_ENABLED:false}
price-import.schedule.retailers=${PRICE_IMPORT_SCHEDULE_RETAILERS:EUROPROM}
price-import.schedule.cron=${PRICE_IMPORT_SCHEDULE_CRON:0 0 3 * * *}
price-import.schedule.zone=Europe/Belgrade

# M1 kontrola kvaliteta meri sve aktivne izvore, pokrivenost kataloga i
# podobnost lokacija za cenovne preporuke. Alarm se uključuje na workeru.
data-quality.stale-price-days=${DATA_QUALITY_STALE_PRICE_DAYS:2}
data-quality.monitor.enabled=${DATA_QUALITY_MONITOR_ENABLED:false}
data-quality.monitor.interval-ms=${DATA_QUALITY_MONITOR_INTERVAL_MS:3600000}
data-quality.monitor.initial-delay-ms=60000

# Maxi objavljuje dnevni CSV po fizičkoj prodavnici. Obuhvaćeni su svi
# danas potvrđeni fajlovi za Valjevo i Divčibare; poslednjih sedam datuma se
# proverava zato što fajl za tekući dan ne mora još biti objavljen.
maxi.price-import.graphql-url=https://www.maxi.rs/api/v1/
maxi.price-import.static-base-url=https://static.maxi.rs/
maxi.price-import.store-codes=${MAXI_PRICE_IMPORT_STORE_CODES:508,538,512,513,541,544}
maxi.price-import.store-file-prefixes=${MAXI_PRICE_IMPORT_STORE_FILE_PREFIXES:508=MAXI_508_KNEZA_MIHAJLA_84_86_VALJEVO_,538=MAXI_538_KARADJORDJEVA_92_VALJEVO_,512=PRODAVNICA_512_OBRENA_NIKOLICA_3_VALJEVO_,513=PRODAVNICA_513_NASELJE_ZBRATIMLJENI_GRADOVI_BB_VALJEVO_,541=MAXI_541_GODJEVACKA_2_DIVCIBARE_VALJEVO_,544=MAXI_544_KARADJORDJEVA_2_VALJEVO_}
# Broj iz imena cenovnika nije globalno jedinstven. Mapa ga vezuje za
# stabilan S-id istog objekta iz zvaničnog Maxi lokatora.
maxi.price-import.store-location-codes=${MAXI_PRICE_IMPORT_STORE_LOCATION_CODES:508=S841,538=S538,512=S512,513=S513,541=S541,544=S927}
maxi.price-import.lookback-days=${MAXI_PRICE_IMPORT_LOOKBACK_DAYS:7}
maxi.price-import.zone=Europe/Belgrade
maxi.price-import.schedule.enabled=${MAXI_PRICE_IMPORT_SCHEDULE_ENABLED:false}
maxi.price-import.schedule.cron=${MAXI_PRICE_IMPORT_SCHEDULE_CRON:0 0 4 * * *}

# Aktuelni zvanični DIS lokator vraća šifru, format, adresu i koordinate.
dis.location-import.url=${DIS_LOCATION_IMPORT_URL:https://www.dis.rs/api/Dis/Locations}

# Europrom objavljuje kompletnu listu objekata i ugrađene koordinate na
# zvaničnoj stranici. Ponavljene koordinate se automatski izdvajaju iz obračuna.
europrom.location-import.url=${EUROPROM_LOCATION_IMPORT_URL:https://europrom.rs/prodajni-objekti/}

# Lidl browser lokator koristi javni stores API. Javni browser ključ je deo
# zvaničnog Lidl frontenda i može se promeniti, zato se može zameniti env-om.
lidl.location-import.url=${LIDL_LOCATION_IMPORT_URL:https://live.api.schwarz/odj/stores-api/v2/myapi/stores-frontend/stores?limit=250&offset=0&country_code=RS&expand=GENERAL_HOURS}
lidl.location-import.api-key=${LIDL_LOCATION_IMPORT_API_KEY:16QaHsGX3Uc3JLhNlS2ZG1CmosbzVPs2}

# Zvanični lokatori ostalih velikih lanaca. Lokacijski import ne uključuje
# prodavnicu u preporuke dok veza sa odgovarajućim cenovnikom nije potvrđena.
maxi.location-import.graphql-url=${MAXI_LOCATION_IMPORT_GRAPHQL_URL:https://www.maxi.rs/api/v1/}
idea.location-import.url=${IDEA_LOCATION_IMPORT_URL:https://www.idea.rs/layout/set/json/Prodavnice}
roda.location-import.url=${RODA_LOCATION_IMPORT_URL:https://roda.rs/roda-prodavnice--p-1}
idea.price-format-mapping.discovery-url=${IDEA_PRICE_FORMAT_MAPPING_DISCOVERY_URL:https://data.gov.rs/sr/datasets/cenovnici-proizvoda-prema-pravilniku-o-uslovima-sadrzaju-i-nacinu-objavljivanja-cenovnika-idea-marketi-doo/}
idea.price-format-mapping.max-download-bytes=${IDEA_PRICE_FORMAT_MAPPING_MAX_DOWNLOAD_BYTES:10000000}
univerexport.location-import.url=${UNIVEREXPORT_LOCATION_IMPORT_URL:https://www.univerexport.rs/api/fetch/fetchProdavnice}

# Potpuni zvanični lokatori se sinhronizuju odvojeno od dnevnih cenovnika.
# Deaktivacija nestale lokacije radi se samo posle potpuno uspešnog odgovora.
verified-location-import.schedule.enabled=${VERIFIED_LOCATION_IMPORT_SCHEDULE_ENABLED:false}
verified-location-import.schedule.cron=${VERIFIED_LOCATION_IMPORT_SCHEDULE_CRON:0 0 2 * * SUN}
verified-location-import.schedule.zone=Europe/Belgrade

# Administratorski endpointi su bez ključa dostupni samo radi lokalnog
# razvoja. Produkciona konfiguracija mora postaviti oba env parametra.
admin.api-key-required=${ADMIN_API_KEY_REQUIRED:false}
admin.api-key=${ADMIN_API_KEY:}
