# Opt in explicitly on the local Mac. Keep the legacy independent schedulers off.
price-refresh.daily.enabled=true
price-import.schedule.enabled=false
maxi.price-import.schedule.enabled=false
data-quality.monitor.enabled=true
logging.file.name=../infra/logs/backend-daily.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
